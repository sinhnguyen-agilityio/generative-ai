[project]
name = "intelligence-collector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-dotenv>=1",
    "streamlit>=1.35",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2",
    "langchain-groq>=0.2",
    "chromadb>=0.5",
    "mcp>=1",
    "langfuse>=2",
    "ragas>=0.2",
    "jsonref>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702", "F401"]

[tool.ruff]
line-length = 100
