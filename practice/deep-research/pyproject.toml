[project]
name = "deep-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "python-dotenv>=1",
    "streamlit>=1.35",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=1.1",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2",
    "langchain-groq>=0.2",
    "chromadb>=0.5",
    "mcp>=1",
    "langfuse>=2",
    "ragas>=0.4.3,<0.5",
    # ragas 0.4 imports langchain_community.chat_models.vertexai, which later releases removed.
    "langchain-community==0.4.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702", "F401"]

[tool.ruff]
line-length = 100
