[project]
name = "mcp-security"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sinh Nguyen", email = "sinh.nguyen@asnet.com.vn" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.12.0",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]


[project.scripts]
mcp-simple-auth-rs = "mcp_server.server:main"
